<!DOCTYPE html>
<head> 
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MQG4SDD4');</script>
<!-- End Google Tag Manager -->
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQG4SDD4"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<!-- Product -->
<h2 id="product-name">Shirt</h2>
<p id="product-price">$29.99</p>
  
<!-- Push to GTM Data Layer -->
<script> 
window.dataLayer = window.dataLayer || [];
window.dataLayer.push({productName : document.getElementById("product-name").textContent, productPrice : document.getElementById("product-price").textContent});
</script>


<!-- Button -->
<button id="send-product">Send Product Data</button>

<script>
  document.getElementById("send-product").addEventListener("click", function () {
    const productData = window.dataLayer.find(item => item.productName && item.productPrice);
    fetch("https://httpbin.org/post", {
      method: "POST",
      body: JSON.stringify({
        productName: productData.productName,
        productPrice: productData.productPrice
      })    
    })
      .then(response => response.json())
      .then(data => { console.log(data.json);
                    });
  });
</body>           
</html>
